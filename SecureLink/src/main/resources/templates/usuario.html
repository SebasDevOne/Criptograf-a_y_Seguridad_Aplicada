<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Mi panel', ~{::contenido})}">
<body>

<div th:fragment="contenido" class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Mi panel de usuario</h1>
                <p class="mb-3">
                    Has iniciado sesión como
                    <strong th:text="${session.usuario}">usuario</strong>
                    con el rol
                    <span class="badge text-bg-primary" th:text="${session.rol}">usuario</span>.
                </p>
                <p class="text-muted mb-0">
                    Esta zona está disponible para las cuentas creadas desde el formulario
                    de registro. El rol se asigna en el servidor y no puede elegirse desde
                    el navegador.
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
