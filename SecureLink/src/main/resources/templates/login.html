<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Iniciar sesión', ~{::contenido})}">
<body>

<div th:fragment="contenido" class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Iniciar sesión</h1>
                <p class="text-muted mb-4">Accede con tu usuario y contraseña.</p>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="usuario" name="usuario"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" name="contrasena"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <p class="text-center mt-4 mb-0">
                    ¿No tienes cuenta?
                    <a th:href="@{/registro}">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
