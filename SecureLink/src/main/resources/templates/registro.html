<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Registro', ~{::contenido})}">
<body>

<div th:fragment="contenido" class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-1">Crear cuenta</h1>
                <p class="text-muted mb-4">
                    Las cuentas registradas desde este formulario siempre tienen el rol
                    <strong>usuario</strong>.
                </p>

                <form th:action="@{/registro}" method="post">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="usuario" name="usuario"
                               maxlength="50" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contrasena" name="contrasena"
                               autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="confirmarContrasena"
                               name="confirmarContrasena" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                </form>

                <p class="text-center mt-4 mb-0">
                    ¿Ya tienes cuenta?
                    <a th:href="@{/login}">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
