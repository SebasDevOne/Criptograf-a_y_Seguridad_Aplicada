<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | SECURELINK'">SECURELINK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<!-- Barra de navegación reutilizable: muestra el usuario y el rol de la sesión. -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">SECURELINK</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Mostrar menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" th:if="${session.rol == 'admin'}">
                    <a class="nav-link" th:href="@{/admin}">Panel de administración</a>
                </li>
                <li class="nav-item" th:if="${session.rol == 'usuario'}">
                    <a class="nav-link" th:href="@{/usuario}">Mi panel</a>
                </li>
                <li class="nav-item" th:if="${session.rol == 'invitado'}">
                    <a class="nav-link" th:href="@{/invitado}">Zona de invitado</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3" th:if="${session.usuario != null}">
                <span class="text-white-50">Usuario:</span>
                <strong class="text-white" th:text="${session.usuario}">usuario</strong>
                <span class="badge text-bg-primary" th:text="${session.rol}">rol</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                </form>
            </div>

            <div class="d-flex gap-2" th:if="${session.usuario == null}">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Iniciar sesión</a>
                <a class="btn btn-primary btn-sm" th:href="@{/registro}">Registrarse</a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4 flex-grow-1">
    <!-- Mensajes de éxito y de error enviados por los controladores. -->
    <div class="alert alert-success" role="alert" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <!-- Aquí se inserta el contenido de cada página. -->
    <div th:replace="${contenido}">Contenido de la página</div>
</main>

<footer class="bg-white border-top py-3 mt-auto">
    <div class="container text-center text-muted small">
        Taller de Criptografía y Seguridad Aplicada · UNIMINUTO · SECURELINK (empresa ficticia)
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
