<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Acceso denegado', ~{::contenido})}">
<body>

<div th:fragment="contenido" class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-danger shadow-sm">
            <div class="card-body p-5 text-center">
                <p class="display-4 text-danger mb-2">403</p>
                <h1 class="h3 mb-3">Acceso denegado</h1>
                <p class="mb-3">
                    Tu rol actual es
                    <span class="badge text-bg-secondary" th:text="${session.rol}">usuario</span>
                    y no tienes permisos para acceder a esta página.
                </p>
                <p class="text-muted mb-0">
                    Vuelve a tu panel desde el menú superior o cierra sesión.
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
