<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Zona de invitado', ~{::contenido})}">
<body>

<div th:fragment="contenido" class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Zona de invitado</h1>
                <p class="mb-3">
                    Bienvenido, <strong th:text="${session.usuario}">invitado</strong>.
                    Tu rol actual es
                    <span class="badge text-bg-primary" th:text="${session.rol}">invitado</span>.
                </p>
                <p class="text-muted mb-0">
                    Este rol tiene acceso únicamente a esta página de demostración.
                    No puede entrar al panel de administración ni al panel de usuario.
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
