spring.application.name=SecureLink

# H2 en memoria: la base se crea al arrancar y se borra al detener la aplicacion.
spring.datasource.url=jdbc:h2:mem:securelink;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El backend provisional crea las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Las plantillas se recargan en caliente durante el desarrollo.
spring.thymeleaf.cache=false

server.port=8080

# La sesion viaja solo en la cookie; evita ;jsessionid en las URLs.
server.servlet.session.tracking-modes=cookie
